---
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - username | length > 0
    fail_msg: "The variable 'username' is required for teardown."

- name: Set workspace namespace
  ansible.builtin.set_fact:
    workspace_namespace: "{{ username }}-ai-ws"
    devspaces_namespace: "{{ username }}-devspaces"

- name: Display teardown summary
  ansible.builtin.debug:
    msg: >-
      Tearing down AI workspace for user '{{ username }}'
      (ArgoCD app: ai-ws-{{ username }},
       team: {{ argocd_project }}).

# ---- GitOps: remove Application CR from git ----

- name: Build authenticated repo URL
  ansible.builtin.set_fact:
    _tenant_repo_auth_url: >-
      {{ tenant_gitops_repo_url | regex_replace('https://', 'https://' + git_token + '@') }}
  no_log: true

- name: Create temporary directory for git operations
  ansible.builtin.tempfile:
    state: directory
    prefix: "ai-ws-teardown-"
  register: gitops_tmpdir

- name: Clone rhoai-gitops-tenant repo
  ansible.builtin.git:
    repo: "{{ _tenant_repo_auth_url }}"
    dest: "{{ gitops_tmpdir.path }}/rhoai-gitops-tenant"
    version: "{{ tenant_gitops_repo_branch }}"
    depth: 1
    force: true
  no_log: true

- name: Configure git user for commit
  ansible.builtin.command:
    cmd: "{{ item }}"
    chdir: "{{ gitops_tmpdir.path }}/rhoai-gitops-tenant"
  loop:
    - git config user.email "aap-automation@redhat.com"
    - git config user.name "AAP Automation"

- name: Check if Application CR file exists
  ansible.builtin.stat:
    path: "{{ gitops_tmpdir.path }}/rhoai-gitops-tenant/{{ argocd_project }}/ai-ws-{{ username }}.yaml"
  register: app_cr_file

- name: Remove Application CR from git
  ansible.builtin.command:
    cmd: git rm "{{ argocd_project }}/ai-ws-{{ username }}.yaml"
    chdir: "{{ gitops_tmpdir.path }}/rhoai-gitops-tenant"
  when: app_cr_file.stat.exists

- name: Commit removal
  ansible.builtin.command:
    cmd: >-
      git commit -m "teardown: ai-ws-{{ username }}"
    chdir: "{{ gitops_tmpdir.path }}/rhoai-gitops-tenant"
  when: app_cr_file.stat.exists

- name: Push to rhoai-gitops-tenant
  ansible.builtin.command:
    cmd: git push origin "{{ tenant_gitops_repo_branch }}"
    chdir: "{{ gitops_tmpdir.path }}/rhoai-gitops-tenant"
  when: app_cr_file.stat.exists
  no_log: true

- name: Clean up temporary directory
  ansible.builtin.file:
    path: "{{ gitops_tmpdir.path }}"
    state: absent

# ---- Wait for ArgoCD cascading deletion ----

- name: Wait for ArgoCD Application to be deleted
  kubernetes.core.k8s_info:
    host: "{{ k8s_host | default(omit, true) }}"
    api_key: "{{ k8s_api_key | default(omit, true) }}"
    validate_certs: "{{ k8s_validate_certs }}"
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: "ai-ws-{{ username }}"
    namespace: "{{ argocd_namespace }}"
  register: app_check
  until: app_check.resources | length == 0
  retries: "{{ (teardown_timeout | int / 10) | int }}"
  delay: 10

# ---- Clean up Dev Spaces namespace label ----

- name: Remove ArgoCD management label from Dev Spaces namespace
  kubernetes.core.k8s:
    host: "{{ k8s_host | default(omit, true) }}"
    api_key: "{{ k8s_api_key | default(omit, true) }}"
    validate_certs: "{{ k8s_validate_certs }}"
    api_version: v1
    kind: Namespace
    name: "{{ devspaces_namespace }}"
    state: present
    definition:
      metadata:
        labels:
          argocd.argoproj.io/managed-by: null
  ignore_errors: true

- name: Confirm teardown complete
  ansible.builtin.debug:
    msg: >-
      AI workspace for user '{{ username }}' has been
      successfully torn down. ArgoCD Application 'ai-ws-{{ username }}'
      and all associated resources have been removed via cascading deletion.
